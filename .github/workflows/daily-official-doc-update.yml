name: Daily official docs update

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate official source manifest
        run: node scripts/check-official-sources.mjs --write-report

      - name: Run Codex official-docs refresh
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: prompts/daily-official-doc-update.md
          output-file: reports/codex-daily-official-doc-update.md
          safety-strategy: drop-sudo
          sandbox: workspace-write

      - name: Re-validate official source manifest
        run: node scripts/check-official-sources.mjs --write-report

      - name: Create pull request when docs changed
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER: ${{ vars.DAILY_DOCS_REVIEWER }}
          ENABLE_AUTO_MERGE: ${{ vars.ENABLE_DAILY_DOCS_AUTO_MERGE }}
        run: |
          set -euo pipefail

          changed="$(git status --porcelain -- SKILL.md README.md docs prompts scripts .github agents .gitignore)"
          if [ -z "$changed" ]; then
            echo "No official-docs changes detected."
            exit 0
          fi

          branch="codex/daily-official-docs-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add SKILL.md README.md docs prompts scripts .github agents .gitignore
          git commit -m "chore: refresh official agent docs"
          git push --set-upstream origin "$branch"

          pr_args=(
            --title "chore: refresh official agent docs"
            --body "Daily official-docs refresh generated by Codex. Review the compatibility claims against docs/official-sources.json before merging."
            --base "${GITHUB_REF_NAME}"
            --head "$branch"
          )
          if [ -n "${REVIEWER:-}" ]; then
            pr_args+=(--reviewer "$REVIEWER")
          fi

          pr_url="$(gh pr create "${pr_args[@]}")"
          echo "Created $pr_url"

          if [ "${ENABLE_AUTO_MERGE:-}" = "true" ]; then
            gh pr merge "$pr_url" --auto --squash --delete-branch
          fi
